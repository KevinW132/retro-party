services:
  - type: web
    name: retro-party-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && node -e "console.log(require('typescript/package.json').version)" && node_modules/.bin/tsc --version && npm run build -w shared && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
